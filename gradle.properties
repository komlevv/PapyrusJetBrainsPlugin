# Keep Gradle state local/cached; dependency resolution for this project is file-based only.
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.java.installations.auto-download=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
